services:
  postgres:
    image: postgres:16
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_slot_wal_keep_size=1024MB"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pgpassword
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: mysqlpassword
      MYSQL_DATABASE: app
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pmysqlpassword"]
      interval: 5s
      timeout: 3s
      retries: 15

  proxy-postgres:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      REVERSE_PROXY_MAX_CAPTURE_ROWS: "${REVERSE_PROXY_MAX_CAPTURE_ROWS:-10000}"
    command:
      - "--engine=postgres"
      - "--backend-host=postgres"
      - "--backend-port=5432"
      - "--backend-user=postgres"
      - "--backend-password=pgpassword"
      - "--backend-db=app"
      - "--ledger-path=/data/pg_undo_ledger.db"
      - "--listen-host=0.0.0.0"
      - "--pg-port=5433"
      - "--mysql-port=0"
      - "--ui-port=8080"
      - "--wal-slot=reverse_proxy_slot"
    ports:
      - "5433:5433"
      - "8080:8080"
    volumes:
      - proxy_data:/data

  proxy-mysql:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      REVERSE_PROXY_MAX_CAPTURE_ROWS: "${REVERSE_PROXY_MAX_CAPTURE_ROWS:-10000}"
    command:
      - "--engine=mysql"
      - "--backend-host=mysql"
      - "--backend-port=3306"
      - "--backend-user=root"
      - "--backend-password=mysqlpassword"
      - "--backend-db=app"
      - "--ledger-path=/data/mysql_undo_ledger.db"
      - "--listen-host=0.0.0.0"
      - "--pg-port=0"
      - "--mysql-port=3307"
      - "--ui-port=8081"
      - "--binlog-poll"
    ports:
      - "3307:3307"
      - "8081:8081"
    volumes:
      - proxy_data:/data

volumes:
  proxy_data:
